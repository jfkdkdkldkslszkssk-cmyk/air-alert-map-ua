<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моніторинг неба України</title>
<style>
body {
  margin: 0;
  background: #080d16;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 20px;
  background: #111b2b;
  text-align: center;
  font-size: 23px;
  font-weight: bold;
}
.status {
  margin: 15px;
  padding: 17px;
  background: #172438;
  border-radius: 12px;
  border-left: 5px solid #35a7ff;
}
.status h3 {
  margin: 0 0 8px;
}
.status p {
  color: #aebbd0;
  margin: 0;
}
footer {
  text-align: center;
  padding: 20px;
  color: #78869b;
}
</style>
</head>
<body>

<header>🇺🇦 МОНІТОРИНГ НЕБА UA</header>

<div class="status">
<h3>🛸 Загроза БпЛА</h3>
<p>Офіційні повідомлення про повітряні загрози</p>
</div>

<div class="status">
<h3>⚡ Загроза реактивних БпЛА</h3>
<p>Статус офіційних попереджень</p>
</div>

<div class="status">
<h3>🚀 Балістична загроза</h3>
<p>Офіційні сповіщення про загрозу</p>
</div>

<div class="status">
<h3>🔴 Ракетна загроза</h3>
<p>Офіційні повідомлення про небезпеку</p>
</div>

<footer>Інформаційна карта повітряних тривог України</footer>

</body>
</html>
